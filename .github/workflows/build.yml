name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run host regression tests
        run: python scripts/test_host.py

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [sender, receiver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build firmware
        # Test the configured path with ephemeral keys and synthetic MACs.
        # These addresses are CI fixtures, not deployable board configuration.
        run: |
          python scripts/configure_pairing.py --sender 02:00:00:00:00:01 --receiver 02:00:00:00:00:02
          pio run -e ${{ matrix.environment }}
